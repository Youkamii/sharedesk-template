<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>ShareDesk 소개 영상 스토리보드</title>
<!--
  ShareDesk 소개 영상 스토리보드 (1920x1080, 30fps, 무음 + 한국어 자막)

  이 페이지의 모든 움직임은 전역 시간값 window.seek(t)(초)로만 그려진다.
  CSS animation / transition / requestAnimationFrame / Date.now 를 그림에 쓰지 않는다.
  render.mjs 가 t = 0, 1/30, 2/30 ... 을 넣고 한 장씩 스크린샷을 찍으므로
  같은 t 는 언제 호출해도 같은 화면이어야 한다(결정론).

  아래 미리보기 막대만 예외로 실제 시계를 써서 seek 를 반복 호출한다.
  render.mjs 는 window.prepareRender() 로 미리보기 막대를 끄고 시작한다.
-->
<style>
  @font-face {
    font-family: "Galmuri11";
    src: url("../../public/fonts/Galmuri11.woff2") format("woff2");
    font-display: block;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    transition: none !important;
    animation: none !important;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070f;
  }

  body {
    font-family: "Galmuri11", "Malgun Gothic", sans-serif;
    color: #fff4d2;
    -webkit-font-smoothing: none;
  }

  /* ---------------- 무대 ---------------- */
  #stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #10172b;
    transform-origin: top left;
  }

  #content {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 930px;
    overflow: hidden;
    background: #0b1020;
  }

  .layer {
    position: absolute;
    inset: 0;
    opacity: 0;
  }

  /* ---------------- 자막 띠 ---------------- */
  #band {
    position: absolute;
    top: 930px;
    left: 0;
    width: 1920px;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 100px;
    background: #0b1122;
    border-top: 4px solid #2f4670;
    box-shadow: 0 -6px 0 rgb(5 9 20 / 60%);
  }

  #cap {
    width: 100%;
    color: #fff4d2;
    font-size: 33px;
    line-height: 1.42;
    text-align: center;
    white-space: pre-line;
    text-shadow: 3px 3px 0 #05080f;
  }

  #blackout {
    position: absolute;
    inset: 0;
    z-index: 900;
    background: #05070f;
    opacity: 0;
  }

  /* ---------------- 공통 픽셀 조각 ---------------- */
  .pix {
    image-rendering: pixelated;
  }

  .brandMark {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 4px;
    background: #0b1021;
    border: 4px solid #f2a56f;
    box-shadow: 4px 4px 0 #080b17;
  }
  .brandMark i:nth-child(1) { background: #ffd27d; }
  .brandMark i:nth-child(2) { background: #61b3a6; }
  .brandMark i:nth-child(3) { background: #e96872; }
  .brandMark i:nth-child(4) { background: #79a8e8; }

  .panel {
    color: #fff4d2;
    background: rgb(22 33 65 / 98%);
    border: 4px solid #0a1020;
    box-shadow: inset 4px 4px 0 rgb(89 114 158 / 70%), inset -4px -4px 0 #111b33, 8px 8px 0 rgb(5 9 20 / 60%);
  }

  .cursor {
    position: absolute;
    z-index: 800;
    width: 36px;
    height: 57px;
    pointer-events: none;
  }

  /* ---------------- 장면 1 · 훅 ---------------- */
  #hookWall {
    position: absolute;
    inset: 0;
    background-position: center center;
    background-size: cover;
    opacity: 0;
  }

  #hookScan {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(to bottom, rgb(5 9 20 / 0%) 0 3px, rgb(5 9 20 / 34%) 3px 6px);
    opacity: 0.5;
  }

  #hookInner {
    position: absolute;
    left: 0;
    top: 250px;
    width: 1920px;
    text-align: center;
  }

  #hookLogoRow {
    display: inline-flex;
    align-items: center;
    gap: 28px;
    opacity: 0;
  }

  #hookLogoRow .brandMark {
    width: 84px;
    height: 84px;
  }

  #hookWord {
    color: #ffd27d;
    font-size: 99px;
    letter-spacing: 0.02em;
    text-shadow: 6px 6px 0 #0a0d1b;
  }

  #hookTag {
    margin-top: 54px;
    color: #fff4d2;
    font-size: 44px;
    text-shadow: 4px 4px 0 #0a0d1b;
    min-height: 60px;
  }

  #hookTagCaret {
    display: inline-block;
    width: 22px;
    height: 38px;
    margin-left: 8px;
    vertical-align: -6px;
    background: #f2a56f;
  }

  #hookRule {
    width: 0;
    height: 8px;
    margin: 46px auto 0;
    background: #f2a56f;
    box-shadow: 0 4px 0 #6b3f26;
  }

  /* ---------------- 장면 2 · 문제 ---------------- */
  #problemInner {
    position: absolute;
    left: 360px;
    top: 205px;
    width: 1200px;
  }

  .probRow {
    display: flex;
    align-items: center;
    gap: 32px;
    width: 100%;
    margin-bottom: 30px;
    padding: 26px 34px;
    font-size: 38px;
    opacity: 0;
  }

  .probGlyph {
    flex: 0 0 auto;
    width: 72px;
    height: 72px;
  }

  #probPunch {
    margin-top: 52px;
    color: #ffd27d;
    font-size: 55px;
    text-align: center;
    text-shadow: 5px 5px 0 #0a0d1b;
    opacity: 0;
  }

  /* ---------------- 장면 3 · 참여 ---------------- */
  #joinInner {
    position: absolute;
    left: 0;
    top: 80px;
    width: 1920px;
    text-align: center;
  }

  .joinBox {
    display: inline-flex;
    align-items: center;
    gap: 22px;
    padding: 24px 40px;
    font-size: 36px;
    opacity: 0;
  }

  .joinBox .brandMark {
    width: 46px;
    height: 46px;
  }

  .joinArrow {
    margin: 22px auto;
    color: #f2a56f;
    font-size: 54px;
    opacity: 0;
  }

  #joinBranch {
    width: 980px;
    margin: 30px auto 0;
    text-align: left;
  }

  .joinChip {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
    padding: 18px 30px;
    font-size: 32px;
    opacity: 0;
  }

  .joinChip .tree {
    color: #61b3a6;
    font-size: 32px;
  }

  .joinChip .avatar {
    width: 40px;
    height: 40px;
    background: #61b3a6;
    border: 4px solid #0a1020;
    box-shadow: inset 4px 4px 0 #b9e1cf;
  }

  #joinCode {
    display: inline-flex;
    align-items: center;
    gap: 20px;
    margin-top: 26px;
    padding: 20px 34px;
    color: #10172b;
    background: #f4e7c5;
    border: 4px solid #10172b;
    box-shadow: inset 4px 4px 0 #fff8e7, inset -4px -4px 0 #9c8c78, 8px 8px 0 rgb(5 9 20 / 55%);
    font-size: 34px;
    opacity: 0;
  }

  #joinCodeValue {
    min-width: 300px;
    color: #2d3a54;
    letter-spacing: 0.14em;
    text-align: left;
  }

  #joinCodeOk {
    color: #2d5c5b;
    opacity: 0;
  }

  /* ---------------- 장면 4~7 · 데스크 모형 ---------------- */
  #desk {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #10172b;
    font-size: 22px;
  }

  .wall {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
  }

  #wStars {
    mix-blend-mode: screen;
  }

  #wallTint {
    position: absolute;
    inset: 0;
    background: rgb(8 13 31 / 14%);
  }

  #wallName {
    position: absolute;
    right: 40px;
    top: 96px;
    padding: 14px 26px;
    font-size: 30px;
    opacity: 0;
  }

  /* 상단 막대 */
  #topBar {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    color: #fff8e7;
    background: rgb(13 20 41 / 94%);
    border-bottom: 4px solid #2f4670;
    box-shadow: 0 4px 0 rgb(5 9 20 / 68%);
  }

  #topBar .left, #topBar .right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  #topBar .brandMark {
    width: 34px;
    height: 34px;
    border-width: 3px;
    gap: 3px;
    padding: 3px;
  }

  #topBar strong {
    color: #ffd27d;
    font-size: 26px;
    text-shadow: 3px 3px 0 #0a0d1b;
  }

  #deskLabel {
    padding-left: 16px;
    color: #aebad3;
    border-left: 2px solid #465578;
  }

  #presenceBtn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    border: 4px solid transparent;
  }

  #presenceBtn .liveDot {
    width: 18px;
    height: 18px;
    background: #61b3a6;
    box-shadow: 0 0 0 3px rgb(97 179 166 / 32%);
  }

  /* 아이콘 */
  .dIcon {
    position: absolute;
    z-index: 2;
    display: flex;
    width: 164px;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 8px 6px;
    border: 4px solid transparent;
  }

  .dIcon svg {
    filter: drop-shadow(4px 4px 0 rgb(5 9 20 / 48%));
  }

  .dIcon span {
    max-width: 156px;
    overflow: hidden;
    color: #fff8e7;
    font-size: 20px;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-shadow: -2px -2px 0 #111629, 2px -2px 0 #111629, -2px 2px 0 #111629, 2px 2px 0 #111629, 4px 4px 0 #111629;
  }

  .dIcon.sel {
    background: rgb(47 70 112 / 72%);
    border-color: #ffd27d;
    box-shadow: inset 0 0 0 4px #1a294a, 4px 4px 0 #0a1020;
  }

  #trashLauncher {
    position: absolute;
    z-index: 3;
    left: 1744px;
    top: 660px;
    display: flex;
    width: 132px;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  #trashLauncher span {
    color: #fff8e7;
    font-size: 22px;
    text-shadow: 3px 3px 0 #0a1020;
  }

  /* 창 */
  .win {
    position: absolute;
    z-index: 20;
    display: grid;
    grid-template-rows: 56px 72px minmax(0, 1fr) 44px;
    overflow: hidden;
    color: #1b1b2f;
    background: #f4e7c5;
    border: 4px solid #10172b;
    box-shadow: inset 4px 4px 0 #fff8e7, inset -4px -4px 0 #7d7180, 12px 12px 0 rgb(5 9 20 / 58%);
    opacity: 0;
  }

  .win.act {
    z-index: 30;
    box-shadow: inset 4px 4px 0 #fff8e7, inset -4px -4px 0 #7d7180, 12px 12px 0 rgb(5 9 20 / 72%), 0 0 0 4px #ffd27d;
  }

  .winTitle {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
    padding: 0 8px 0 16px;
    color: #e0e4ed;
    background: #596078;
    border-bottom: 4px solid #10172b;
    font-size: 22px;
  }

  .win.act .winTitle {
    color: #fff8e7;
    background: #2d5c5b;
  }

  .winTitle strong {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .winCtl {
    display: flex;
    gap: 6px;
    margin-left: auto;
  }

  .winCtl i {
    position: relative;
    display: block;
    width: 46px;
    height: 40px;
    background: #f4e7c5;
    border: 4px solid #1b1b2f;
    box-shadow: inset 4px 4px 0 #fff8e7, inset -4px -4px 0 #8f806d;
  }

  .winCtl i.cl { background: #c9615f; }

  .winCtl i.mn::after {
    content: "";
    position: absolute;
    left: 8px;
    bottom: 6px;
    width: 18px;
    height: 4px;
    background: #1b1b2f;
  }

  .winCtl i.mx::after {
    content: "";
    position: absolute;
    left: 7px;
    top: 5px;
    width: 20px;
    height: 18px;
    border: 4px solid #1b1b2f;
  }

  .winCtl i.cl::after {
    content: "×";
    position: absolute;
    left: 0;
    top: -6px;
    width: 100%;
    color: #1b1b2f;
    font-size: 28px;
    text-align: center;
  }

  .winTool {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 14px;
    background: #e5d6b7;
    border-bottom: 4px solid #9c8c78;
  }

  .addr {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    padding: 10px 14px;
    color: #2d3a54;
    background: #fff8e7;
    border: 4px solid #1b1b2f;
    box-shadow: inset 3px 3px 0 #c7b994;
    font-size: 22px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tbtn {
    flex: 0 0 auto;
    padding: 10px 16px;
    color: #1b1b2f;
    background: #e5d6b7;
    border: 4px solid #1b1b2f;
    box-shadow: inset 3px 3px 0 #fff8e7, inset -3px -3px 0 #9c8c78;
    font-size: 22px;
    white-space: nowrap;
  }

  .tbtn.on {
    color: #fff8e7;
    background: #2d5c5b;
    box-shadow: inset 3px 3px 0 #61b3a6, inset -3px -3px 0 #16332f;
  }

  .winBody {
    position: relative;
    overflow: hidden;
    background: #f4e7c5;
  }

  .winStat {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    color: #4b4f60;
    background: #e5d6b7;
    border-top: 4px solid #9c8c78;
    font-size: 20px;
  }

  .fIcon {
    position: absolute;
    display: flex;
    width: 140px;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 6px;
    border: 4px solid transparent;
  }

  .fIcon span {
    max-width: 132px;
    overflow: hidden;
    color: #1b1b2f;
    font-size: 20px;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-shadow: 2px 2px 0 #fff8e7;
  }

  .fIcon.sel {
    background: #9cc7bf;
    border-color: #2d5c5b;
    box-shadow: inset 0 0 0 4px #d7e4cc, 4px 4px 0 #6c6d6c;
  }

  /* 미리보기 창 */
  #previewImgWrap {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: #1b1b2f;
  }

  #previewImgWrap img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  #previewTextWrap {
    position: absolute;
    inset: 0;
    padding: 24px 28px;
    color: #1b1b2f;
    background: #fff8e7;
    font-size: 24px;
    line-height: 1.6;
    white-space: pre-wrap;
    opacity: 0;
  }

  #previewCaret {
    display: inline-block;
    width: 14px;
    height: 26px;
    vertical-align: -4px;
    background: #2d5c5b;
  }

  /* 폴더 메모 창 */
  #noteText {
    position: absolute;
    inset: 0;
    padding: 22px 26px;
    color: #1b1b2f;
    background: #fff8e7;
    font-size: 24px;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  /* 채팅 창 */
  #winChat .winBody {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 20px;
    background: #182446;
  }

  .chatMsg {
    max-width: 92%;
    padding: 14px 18px;
    color: #1b1b2f;
    background: #f4e7c5;
    border: 4px solid #0a1020;
    box-shadow: 4px 4px 0 rgb(5 9 20 / 45%);
    font-size: 22px;
    opacity: 0;
  }

  .chatMsg b {
    display: block;
    margin-bottom: 6px;
    color: #2d5c5b;
    font-size: 19px;
  }

  .chatMsg.mine {
    align-self: flex-end;
    background: #9cc7bf;
  }

  #chatComposer {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 0 14px;
    background: #e5d6b7;
    border-top: 4px solid #9c8c78;
  }

  /* 간이 링크 만들기 창 */
  #quickDrop {
    position: absolute;
    inset: 20px;
    display: grid;
    place-items: center;
    color: #6b6552;
    background: #efe2c0;
    border: 6px dashed #b5a57f;
    font-size: 26px;
    text-align: center;
  }

  #quickCard {
    position: absolute;
    left: 240px;
    top: 60px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 22px;
    color: #1b1b2f;
    background: #fff8e7;
    border: 4px solid #1b1b2f;
    box-shadow: 6px 6px 0 rgb(5 9 20 / 40%);
    font-size: 22px;
    opacity: 0;
  }

  #quickRow {
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: 24px;
    padding: 18px 22px;
    color: #1b1b2f;
    background: #fff8e7;
    border: 4px solid #1b1b2f;
    box-shadow: inset 3px 3px 0 #ffffff, 6px 6px 0 rgb(5 9 20 / 34%);
    opacity: 0;
  }

  .bar {
    height: 22px;
    margin: 12px 0 0;
    background: #d8ccb1;
    border: 4px solid #1b1b2f;
  }

  .bar i {
    display: block;
    height: 100%;
    background: #f2a56f;
  }

  .linkLine {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 12px;
    font-size: 21px;
  }

  .linkLine code {
    flex: 1;
    overflow: hidden;
    padding: 8px 12px;
    color: #2d3a54;
    background: #efe2c0;
    border: 3px solid #9c8c78;
    font-family: inherit;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .hourBadge {
    padding: 6px 12px;
    color: #10172b;
    background: #ffd27d;
    border: 3px solid #1b1b2f;
    font-size: 19px;
  }

  /* 생성된 링크 창 */
  .shareRow {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 16px;
    padding: 18px 22px;
    border-bottom: 4px solid #d8ccb1;
    font-size: 22px;
    opacity: 0;
  }

  .shareRow.stopped {
    color: #8a8477;
    background: #e9dcbd;
  }

  .shareRow small {
    display: block;
    margin-top: 6px;
    color: #6b6552;
    font-size: 19px;
  }

  /* 우클릭 메뉴 */
  #ctxMenu {
    position: absolute;
    z-index: 60;
    width: 380px;
    padding: 10px 0;
    color: #1b1b2f;
    background: #f4e7c5;
    border: 4px solid #10172b;
    box-shadow: inset 4px 4px 0 #fff8e7, 10px 10px 0 rgb(5 9 20 / 55%);
    opacity: 0;
  }

  .mItem {
    padding: 12px 24px;
    font-size: 24px;
  }

  .mItem.hot {
    color: #fff8e7;
    background: #2d5c5b;
  }

  .mItem.danger { color: #a53c46; }

  .mSep {
    height: 4px;
    margin: 8px 10px;
    background: #9c8c78;
    box-shadow: 0 2px 0 #fff8e7;
  }

  /* 알림 */
  #toast {
    position: absolute;
    z-index: 70;
    left: 560px;
    top: 690px;
    width: 800px;
    padding: 22px 28px;
    color: #10172b;
    background: #ffd27d;
    border: 4px solid #0a1020;
    box-shadow: inset 4px 4px 0 #fff4d2, inset -4px -4px 0 #b5754f, 8px 8px 0 rgb(5 9 20 / 55%);
    font-size: 26px;
    opacity: 0;
  }

  #toast code {
    font-family: inherit;
  }

  /* 접속자 패널 */
  #presencePanel {
    position: absolute;
    z-index: 50;
    right: 24px;
    top: 72px;
    width: 460px;
    padding: 22px 24px;
    opacity: 0;
  }

  #presencePanel > strong {
    display: block;
    margin-bottom: 16px;
    color: #ffd27d;
    font-size: 24px;
  }

  .pMember {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 0;
    border-top: 3px solid #2f4670;
    font-size: 22px;
  }

  .pMember i {
    width: 18px;
    height: 18px;
    background: #61b3a6;
  }

  .pMember em {
    margin-left: auto;
    color: #ffd27d;
    font-size: 20px;

}

    '<path d="M4 3H15L21 9V22H4Z" fill="' + IC.shadow + '" transform="translate(2 2)"/>' +

    '<path d="M14 3L18 7H14Z" fill="' + IC.light + '"/>' + inner

}

        '<path d="M4 15H18V17H4Z" fill="' + p[2] + '"/>',
      size

  if (kind === "video") {
    return svgFrame(
      fileShell(
        '<path d="M5 9H17V17H5Z" fill="' + IC.teal + '"/>' +
          '<path d="M9 11L14 13L9 16Z" fill="' + IC.amber + '"/>' +
          '<path d="M5 9H7V11H5ZM15 9H17V11H15ZM5 15H7V17H5ZM15 15H17V17H15Z" fill="' + IC.light + '"/>'

    );

  if (kind === "archive") {
    return svgFrame(

}

// 픽셀 커서 — 12x19 도트를 rect 로 찍는다.

];
const CURSOR_IN = [
  "............",

  ".XX.........",

  ".XXXX.......",
  ".XXXXX......",
  ".XXXXXX.....",
  ".XXXXXXX....",

  ".XX..XX.....",

  ".......XX...",
  "........XX..",
  "............",
];

function bitmapRects(rows, fill) {
  let out = "";
  for (let y = 0; y < rows.length; y += 1) {
    const row = rows[y];
    let x = 0;
    while (x < row.length) {
      if (row[x] === "X") {
        let w = 1;
        while (x + w < row.length && row[x + w] === "X") w += 1;
        out += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="1" fill="' + fill + '"/>';
        x += w;
      } else {
        x += 1;
      }
    }
  }
  return out;
}

function cursorSvg() {
  return (
    '<svg width="36" height="57" viewBox="0 0 12 19" shape-rendering="crispEdges" style="filter:drop-shadow(3px 3px 0 rgba(5,9,20,.55))">' +
    bitmapRects(CURSOR_OUT, "#10172b") +
    bitmapRects(CURSOR_IN, "#fff8e7") +
    "</svg>"
  );
}

function brandMark(cls) {

/* ============================================================
   4. 시간 도우미 (모두 순수 함수 — 실제 시계를 쓰지 않는다)
   ============================================================ */
function clamp01(v) {
  return v < 0 ? 0 : v > 1 ? 1 : v;
}

// start 에서 시작해 dur 동안 0 → 1
function ramp(t, start, dur) {
  if (dur <= 0) return t >= start ? 1 : 0;
  return clamp01((t - start) / dur);
}

function easeOut(p) {
  return 1 - Math.pow(1 - p, 3);
}

function easeInOut(p) {
  return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
}

// start 에 나타나 end 에 사라진다 (fd 초 동안 부드럽게)
function window01(t, start, end, fd) {
  fd = fd === undefined ? 0.3 : fd;
  if (t < start || t > end) return 0;
  return Math.min(1, Math.min((t - start) / fd, (end - t) / fd));
}

function lerp(a, b, p) {
  return a + (b - a) * p;
}

// 깜빡임 — period 초마다 0/1 이 뒤집힌다
function blink(t, period) {
  return Math.floor(t / period) % 2 === 0 ? 1 : 0;
}

function typed(text, t, start, cps) {
  const n = Math.floor(Math.max(0, t - start) * cps);
  return text.slice(0, Math.min(text.length, n));
}

function op(el, v) {
  if (el) el.style.opacity = String(v);
}

function show(el, on) {
  if (el) el.style.display = on ? "" : "none";
}

function cls(el, name, on) {
  if (!el) return;
  if (on) el.classList.add(name);
  else el.classList.remove(name);
}

// 창 열림 — 0.14s 동안 작게에서 제 크기로
function openWin(el, t, start, end) {
  if (!el) return 0;
  const a = window01(t, start, end, 0.22);
  op(el, a);
  const g = ramp(t, start, 0.14);
  const s = lerp(0.9, 1, easeOut(g));
  el.style.transform = a > 0 ? "scale(" + s.toFixed(4) + ")" : "scale(1)";
  return a;
}

function drawCaption(t) {
  let text = "";
  let alpha = 0;
  for (let i = 0; i < CAPS.length; i += 1) {
    const c = CAPS[i];
    if (t >= c[0] && t < c[1]) {
      text = c[2];
      alpha = Math.min(1, Math.min((t - c[0]) / 0.22, (c[1] - t) / 0.22));
      break;
    }
  }
  if (cap.textContent !== text) cap.textContent = text;
  op(cap, clamp01(alpha));
}

/* --- 장면 1 --- */
const HOOK_TAG = "한 사람의 Google Drive, 모두의 바탕화면";

function drawHook(t) {
  // 장면끼리는 잠깐 어두워졌다 다음 장면이 올라오게 붙여 둔다.
  const on = window01(t, 0, 7.1, 0.3);
  op($("lyHook"), on);
  if (on <= 0) return;

  op($("hookWall"), lerp(0, 0.4, easeOut(ramp(t, 0.4, 2.6))));

  // 커서가 화면 가운데로 와서 한 번 누른다
  const mp = easeInOut(ramp(t, 0.35, 1.25));
  const cx = lerp(250, 905, mp);
  const cy = lerp(700, 455, mp);
  const pressed = t >= 1.62 && t < 1.78 ? 0.84 : 1;
  const cur = $("curHook");
  cur.style.transform = "translate(" + Math.round(cx) + "px," + Math.round(cy) + "px) scale(" + pressed + ")";
  op(cur, window01(t, 0.2, 2.5, 0.25));

  // 로고가 튀어 오른다
  const lg = ramp(t, 1.76, 0.3);
  const row = $("hookLogoRow");
  op(row, clamp01(lg * 1.4));
  row.style.transform = "scale(" + lerp(0.78, 1, easeOut(lg)).toFixed(4) + ")";

  // 부제는 한 글자씩
  const txt = typed(HOOK_TAG, t, 2.45, 17);
  const tagEl = $("hookTagText");
  if (tagEl.textContent !== txt) tagEl.textContent = txt;
  const caretOn = t >= 2.4 && t < 5.2 ? blink(t - 2.4, 0.4) : 0;
  op($("hookTagCaret"), caretOn);

  // 밑줄
  $("hookRule").style.width = Math.round(lerp(0, 760, easeOut(ramp(t, 4.35, 0.75)))) + "px";
  op($("hookRule"), t >= 4.35 ? 1 : 0);
}

/* --- 장면 2 --- */
function drawProblem(t) {
  const on = window01(t, 7.1, 15.1, 0.3);
  op($("lyProblem"), on);
  if (on <= 0) return;

  const starts = [7.35, 8.85, 10.35];
  for (let i = 0; i < 3; i += 1) {
    const el = $("probRow" + i);
    const p = ramp(t, starts[i], 0.32);
    const dim = t >= 12.0 ? lerp(1, 0.32, ramp(t, 12.0, 0.45)) : 1;
    op(el, p * dim);
    el.style.transform = "translateX(" + Math.round(lerp(-46, 0, easeOut(p))) + "px)";
  }

  const punch = $("probPunch");
  const pp = ramp(t, 12.15, 0.35);
  op(punch, pp);
  punch.style.transform = "scale(" + lerp(0.9, 1, easeOut(pp)).toFixed(4) + ")";
}

function drawJoin(t) {
  const on = window01(t, 15.1, 23.95, 0.3);
  op($("lyJoin"), on);
  if (on <= 0) return;

  const top = $("joinTop");
  const tp = ramp(t, 15.25, 0.32);
  op(top, tp);
  top.style.transform = "translateY(" + Math.round(lerp(-34, 0, easeOut(tp))) + "px)";

  const ar = $("joinArrow");
  op(ar, ramp(t, 16.1, 0.25) * (t >= 16.1 ? 0.55 + 0.45 * blink(t - 16.1, 0.45) : 0));

  const mid = $("joinMid");
  const mp = ramp(t, 16.55, 0.32);
  op(mid, mp);
  mid.style.transform = "scale(" + lerp(0.9, 1, easeOut(mp)).toFixed(4) + ")";

  const chipStart = [17.4, 18.05, 18.7];
  for (let i = 0; i < 3; i += 1) {
    const el = $("joinChip" + i);
    const p = ramp(t, chipStart[i], 0.28);
    op(el, p);
    el.style.transform = "translateX(" + Math.round(lerp(-40, 0, easeOut(p))) + "px)";
  }

  const code = $("joinCode");
  op(code, ramp(t, 19.7, 0.3));
  const codeText = typed("DUSK-ROOM-24", t, 20.0, 7);
  const cv = $("joinCodeValue");
  const caret = t >= 20.0 && t < 21.7 ? (blink(t - 20.0, 0.35) ? "_" : " ") : "";
  const wanted = codeText + caret;
  if (cv.textContent !== wanted) cv.textContent = wanted;
  op($("joinCodeOk"), ramp(t, 21.75, 0.25));
}

const NOTE_TEXT = "· 사진은 ‘사진’ 폴더에 모아 주세요\n· 보고서.txt 는 다 같이 고치는 중\n· 다음 모임 자료는 2026 자료 안에";
const PREVIEW_TEXT = "2026 상반기 보고서\n\n1. 파일은 한곳에 모읍니다.\n2. 폴더 메모로 약속을 남깁니다.\n3. 링크는 한 시간만 열어 둡니다.";

function drawDesk(t) {
  const on = Math.min(window01(t, 23.95, 71.1, 0.4), 1);
  op($("lyDesk"), on);
  if (on <= 0) return;

  /* ---- 배경 ---- */
  // 63.9~68.2 사이에 해 질 녘 → 깊은 밤 → 여명 → 밤바다
  const duskA = 1 - clamp01(ramp(t, 63.9, 0.7));
  const nightA = clamp01(ramp(t, 63.9, 0.7)) * (1 - clamp01(ramp(t, 65.3, 0.7)));
  const dawnA = clamp01(ramp(t, 65.3, 0.7)) * (1 - clamp01(ramp(t, 66.7, 0.7)));
  const tideA = clamp01(ramp(t, 66.7, 0.7));
  op($("wDusk"), duskA);
  op($("wNight"), nightA);
  op($("wDawn"), dawnA);
  op($("wTide"), tideA);
  // 밤바다의 별빛만 살짝 흔들린다 (계단식으로 — 실제 화면의 steps 연출과 같은 결)
  const starStep = Math.floor(((t * 1000) % 2400) / 300);
  op($("wStars"), tideA * (0.28 + 0.05 * (starStep % 3)));

  const wallNames = [
    [63.9, 65.3, "깊은 밤"],
    [65.3, 66.7, "여명"],
    [66.7, 68.4, "밤바다"],
  ];
  let wn = 0;
  let wnText = "해 질 녘";
  for (let i = 0; i < wallNames.length; i += 1) {
    if (t >= wallNames[i][0] && t < wallNames[i][1]) {
      wn = window01(t, wallNames[i][0], wallNames[i][1], 0.25);
      wnText = wallNames[i][2];
    }
  }
  if (t >= 63.0 && t < 63.9) {
    wn = window01(t, 63.0, 64.0, 0.25);
    wnText = "해 질 녘";
  }
  const wallNameEl = $("wallName");
  if (wallNameEl.textContent !== wnText) wallNameEl.textContent = wnText;
  op(wallNameEl, wn);

  /* ---- 바탕화면 아이콘 ---- */
  // ‘사진’ 폴더를 끌어다 아래로 옮긴다 (24.9 ~ 26.2)
  const dragP = easeInOut(ramp(t, 24.95, 1.15));
  const di1 = $("di1");
  const dx = Math.round(lerp(0, -168, dragP));
  const dy = Math.round(lerp(0, 380, dragP));
  di1.style.transform = "translate(" + dx + "px," + dy + "px)";
  cls(di1, "sel", t >= 24.8 && t < 26.6);
  op(di1, t >= 24.95 && t < 26.15 ? 0.72 : 1);

  // 파일 선택 표시
  cls($("di5"), "sel", t >= 47.5 && t < 50.2);
  cls($("di0"), "sel", t >= 26.45 && t < 27.4);

  /* ---- 커서 ---- */
  const curDesk = $("curDesk");
  let cx = 300;
  let cy = 300;
  let curOn = 0;
  let curScale = 1;
  if (t >= 24.5 && t < 27.6) {
    // 아이콘 끌기 → 문서 폴더 두 번 누르기
    const p1 = easeInOut(ramp(t, 24.55, 0.4));
    const p2 = easeInOut(ramp(t, 24.95, 1.15));
    const p3 = easeInOut(ramp(t, 26.2, 0.35));
    cx = lerp(lerp(700, 300, p1), 132, p2);
    cy = lerp(lerp(560, 150, p1), 530, p2);
    cx = lerp(cx, 120, p3);
    cy = lerp(cy, 150, p3);
    curOn = window01(t, 24.5, 27.6, 0.25);
    curScale = (t >= 26.5 && t < 26.62) || (t >= 26.68 && t < 26.8) ? 0.84 : 1;
  } else if (t >= 47.4 && t < 50.3) {
    // 안내서.pdf 우클릭 → 공유 링크 만들기
    const p1 = easeInOut(ramp(t, 47.45, 0.45));
    const p2 = easeInOut(ramp(t, 48.55, 0.5));
    cx = lerp(300, 300, p1);
    cy = lerp(500, 340, p1);
    cx = lerp(cx, 430, p2);
    cy = lerp(cy, 520, p2);
    curOn = window01(t, 47.4, 50.3, 0.25);
    curScale = t >= 49.0 && t < 49.14 ? 0.84 : 1;
  } else if (t >= 53.6 && t < 55.4) {
    // 생성된 링크 창에서 멈추기 누르기
    const p1 = easeInOut(ramp(t, 53.7, 0.7));
    cx = lerp(1120, 1452, p1);
    cy = lerp(600, 458, p1);
    curOn = window01(t, 53.6, 55.4, 0.25);
    curScale = t >= 54.62 && t < 54.76 ? 0.84 : 1;
  }
  op(curDesk, curOn);
  curDesk.style.transform = "translate(" + Math.round(cx) + "px," + Math.round(cy) + "px) scale(" + curScale + ")";

  /* ---- 창 ---- */
  const aDocs = openWin($("winDocs"), t, 26.85, 47.2);
  const aPrev = openWin($("winPreview"), t, 28.55, 36.3);
  const aNote = openWin($("winNote"), t, 32.55, 36.3);
  const aChat = openWin($("winChat"), t, 40.85, 44.25);
  const aQuick = openWin($("winQuick"), t, 50.4, 53.35);
  const aLinks = openWin($("winLinks"), t, 53.45, 56.0);

  // 활성 창 테두리
  cls($("winDocs"), "act", t >= 26.85 && t < 28.55);
  cls($("winPreview"), "act", t >= 28.55 && t < 32.55);
  cls($("winNote"), "act", t >= 32.55 && t < 36.3);
  cls($("winChat"), "act", t >= 40.85 && t < 44.25);
  cls($("winQuick"), "act", aQuick > 0);
  cls($("winLinks"), "act", aLinks > 0);

  // 최소화·최대화 단추 강조 (34.4~36.0)
  const ctlHi = t >= 34.5 && t < 35.9 ? blink(t - 34.5, 0.3) : 0;
  const ctls = $("winNote").querySelectorAll(".winCtl i");
  for (let i = 0; i < ctls.length; i += 1) {
    ctls[i].style.outline = ctlHi && i < 2 ? "4px solid #ffd27d" : "none";
  }

  // 미리보기 창 — 사진에서 .txt 편집으로
  const toText = t >= 30.6;
  op($("previewTextWrap"), toText ? 1 : 0);
  op($("previewImgWrap"), toText ? 0 : 1);
  const pTitle = $("previewTitle");
  const wantTitle = toText ? "보고서.txt" : "여름사진.png";
  if (pTitle.textContent !== wantTitle) pTitle.textContent = wantTitle;
  const pStat = $("previewStat");
  const wantStat = toText ? "텍스트 · 함께 고치는 중" : "사진 · 2.4 MB";
  if (pStat.textContent !== wantStat) pStat.textContent = wantStat;
  cls($("previewTool0"), "on", !toText);
  cls($("previewSave"), "on", toText);
  const pt = typed(PREVIEW_TEXT, t, 30.75, 26);
  const pTextEl = $("previewText");
  if (pTextEl.textContent !== pt) pTextEl.textContent = pt;
  op($("previewCaret"), toText ? blink(t - 30.6, 0.4) : 0);

  // 폴더 메모 — 한 글자씩
  const nt = typed(NOTE_TEXT, t, 32.7, 36);
  const noteEl = $("noteText");
  if (noteEl.textContent !== nt) noteEl.textContent = nt;

  // 채팅 메시지
  const chatStart = [41.15, 42.15, 43.2];
  for (let i = 0; i < 3; i += 1) {
    const el = $("chat" + i);
    const p = ramp(t, chatStart[i], 0.22);
    op(el, p * aChat);
    el.style.transform = "translateY(" + Math.round(lerp(14, 0, easeOut(p))) + "px)";
  }

  // 간이 링크 만들기 — 파일이 떨어지고 → 올라가고 → 링크가 생긴다
  const dropP = easeInOut(ramp(t, 50.75, 0.45));
  const qc = $("quickCard");
  op(qc, window01(t, 50.7, 52.0, 0.2) * aQuick);
  qc.style.transform = "translateY(" + Math.round(lerp(-120, 150, dropP)) + "px)";
  const upP = clamp01(ramp(t, 51.25, 1.05));
  op($("quickRow"), window01(t, 51.2, 53.35, 0.22) * aQuick);
  $("quickBar").style.width = Math.round(upP * 100) + "%";
  op($("quickLink"), ramp(t, 52.35, 0.25));
  const qStat = $("quickStat");
  const wantQ = upP >= 1 ? "완료 · 링크 준비됨" : "올리는 중 " + Math.round(upP * 100) + "%";
  if (qStat.textContent !== wantQ) qStat.textContent = wantQ;
  op($("quickDrop"), aQuick > 0 ? (t >= 50.9 ? 0.25 : 1) : 1);

  // 생성된 링크 — 줄이 하나씩, 두 번째 줄을 멈춘다
  const shrStart = [53.6, 53.85, 54.1];
  for (let i = 0; i < 3; i += 1) {
    op($("shr" + i), ramp(t, shrStart[i], 0.22) * aLinks);
  }
  const stopped = t >= 54.72;
  cls($("shr1"), "stopped", stopped);
  const shr1Stop = $("shr1Stop");
  const wantStop = stopped ? "멈춤" : "멈추기";
  if (shr1Stop.textContent !== wantStop) shr1Stop.textContent = wantStop;
  const linksStat = $("linksStat");
  const wantLs = stopped ? "활성 링크 2개 · 1개 멈춤" : "활성 링크 3개";
  if (linksStat.textContent !== wantLs) linksStat.textContent = wantLs;

  // 우클릭 메뉴와 알림
  op($("ctxMenu"), window01(t, 47.85, 49.12, 0.12));
  cls($("ctxShare"), "hot", t >= 48.6);
  op($("toast"), window01(t, 49.15, 50.35, 0.22));

  // 접속자 패널 / 역할 패널
  op($("presencePanel"), window01(t, 36.55, 39.1, 0.25));
  const pbOn = t >= 36.35 && t < 39.3;
  $("presenceBtn").style.borderColor = pbOn ? "#ffd27d" : "transparent";
  $("presenceBtn").style.background = pbOn ? "rgb(47 70 112 / 72%)" : "transparent";

  const rolePanelA = window01(t, 44.3, 47.0, 0.28);
  op($("rolePanel"), rolePanelA);
  for (let i = 0; i < 3; i += 1) {
    const el = $("role" + i);
    const p = ramp(t, 44.45 + i * 0.35, 0.25);
    op(el, p * rolePanelA);
    el.style.transform = "translateX(" + Math.round(lerp(28, 0, easeOut(p))) + "px)";
  }

  // 용량 도넛
  const quotaA = window01(t, 60.45, 63.5, 0.3);
  op($("quotaPanel"), quotaA);
  const qp = easeOut(clamp01(ramp(t, 60.7, 1.35)));
  const usedGb = 12.6 * qp;
  const resGb = 1.8 * qp;
  const limitGb = 20;
  const usedPct = (usedGb / limitGb) * 100;
  const totalPct = ((usedGb + resGb) / limitGb) * 100;
  $("donut").style.background =
    "conic-gradient(#61b3a6 0 " + usedPct.toFixed(2) + "%, #ffd27d " + usedPct.toFixed(2) + "% " + totalPct.toFixed(2) + "%, #766f69 " + totalPct.toFixed(2) + "% 100%)";
  setText($("donutUsed"), usedGb.toFixed(1) + " GB");
  setText($("donutPct"), Math.round(totalPct) + "%");
  setText($("legUsed"), usedGb.toFixed(1) + " GB");
  setText($("legRes"), resGb.toFixed(1) + " GB");
  setText($("legFree"), Math.max(0, limitGb - usedGb - resGb).toFixed(1) + " GB");

  // 언어 칩
  const langA = window01(t, 68.75, 71.2, 0.3);
  op($("langRow"), langA);
  const pick = Math.min(4, Math.floor(Math.max(0, t - 68.95) / 0.42));
  for (let i = 0; i < 5; i += 1) {
    const el = $("lang" + i);
    const p = ramp(t, 68.85 + i * 0.12, 0.22);
    op(el, p * langA);
    el.style.transform = "translateY(" + Math.round(lerp(22, 0, easeOut(p))) + "px)";
    cls(el, "on", langA > 0 && i === pick);
  }

  // 이어받기 패널
  op($("resumePanel"), window01(t, 58.35, 60.3, 0.28));

  /* ---- 작업표시줄 ---- */
  show($("tbDocs"), aDocs > 0);
  show($("tbPreview"), aPrev > 0);
  show($("tbNote"), aNote > 0);
  show($("tbQuick"), aQuick > 0);
  show($("tbLinks"), aLinks > 0);
  setText($("tbPreview"), toText ? "보고서.txt" : "여름사진.png");
  cls($("tbDocs"), "on", t >= 26.85 && t < 28.55);
  cls($("tbPreview"), "on", t >= 28.55 && t < 32.55);
  cls($("tbNote"), "on", t >= 32.55 && t < 36.3);
  cls($("tbQuick"), "on", aQuick > 0);
  cls($("tbLinks"), "on", aLinks > 0);

  // 채팅 단추 — 읽지 않은 수가 있으면 반짝인다
  const chatUnread = t >= 39.25 && t < 40.85;
  show($("tbChat"), true);
  show($("chatBadge"), chatUnread);
  cls($("tbChat"), "blink", chatUnread && blink(t - 39.25, 0.6) === 1);
  cls($("tbChat"), "on", aChat > 0);

  // 전송 중 칩 (56.0~57.05 사이 올리는 중, 새로고침 뒤에는 사라진다)
  const upOn = t >= 55.9 && t < 57.05;
  show($("upChip"), upOn);
  if (upOn) {
    const pct = Math.round(lerp(18, 41, clamp01(ramp(t, 55.9, 1.1))));
    setText($("upChipText"), "전송 중 2개 · 여행영상.mp4 · " + pct + "%");
  }

  // 새로고침 뒤 이어받기 칩
  const resumeOn = t >= 57.5 && t < 60.3;
  show($("resumeChip"), resumeOn);
  $("resumeChip").style.outline = resumeOn && blink(t - 57.5, 0.55) ? "4px solid #ffd27d" : "none";

  setText($("presenceText"), "함께 쓰는 중 · 3명");
}

function setText(el, v) {
  if (el && el.textContent !== v) el.textContent = v;
}

/* --- 새로고침 번쩍임 (장면 6) --- */
const flash = document.createElement("div");
flash.style.cssText = "position:absolute;inset:0;z-index:850;background:#fff8e7;opacity:0;pointer-events:none";
content.appendChild(flash);

function drawFlash(t) {
  // 57.05 에 화면이 한 번 하얗게 번쩍이고 57.45 까지 돌아온다
  let a = 0;
  if (t >= 57.02 && t < 57.5) {
    a = t < 57.14 ? clamp01((t - 57.02) / 0.1) : clamp01((57.5 - t) / 0.34);
  }
  op(flash, a);
}

/* --- 장면 8 --- */
function drawOutro(t) {
  const on = window01(t, 71.1, 81.2, 0.5);
  op($("lyOutro"), on);
  if (on <= 0) return;

  // 실제 화면을 1.4초 정도 그대로 보여 준 뒤 어둡게 덮는다.
  op($("outroVeil"), lerp(0.06, 0.94, easeOut(ramp(t, 72.5, 1.1))));
  op($("outroPlate"), lerp(0, 0.9, easeOut(ramp(t, 72.7, 1.0))));

  const lg = ramp(t, 73.2, 0.4);
  const row = $("outroLogoRow");
  op(row, lg);
  row.style.transform = "scale(" + lerp(0.86, 1, easeOut(lg)).toFixed(4) + ")";

  const up = ramp(t, 74.4, 0.4);
  const url = $("outroUrl");
  op(url, up);
  url.style.transform = "translateY(" + Math.round(lerp(26, 0, easeOut(up))) + "px)";

  op($("outroSub"), ramp(t, 75.4, 0.4));
}

/* ============================================================
   7. seek — 이 영상의 유일한 시간 입구
   ============================================================ */
function seek(t) {
  if (!isFinite(t)) t = 0;
  if (t < 0) t = 0;
  if (t > DURATION) t = DURATION;

  drawHook(t);
  drawProblem(t);
  drawJoin(t);
  drawDesk(t);
  drawFlash(t);
  drawOutro(t);
  drawCaption(t);

  // 처음과 끝은 검은 화면에서 들어오고 나간다
  let black = 0;
  if (t < 0.6) black = 1 - clamp01(t / 0.6);
  if (t > 79.6) black = Math.max(black, clamp01((t - 79.6) / 1.2));
  op(blackout, black);

  // 자막 띠도 마지막에는 함께 어두워진다
  op(document.getElementById("band"), 1);
}

window.seek = seek;
window.DURATION = DURATION;
window.STAGE_W = STAGE_W;
window.STAGE_H = STAGE_H;

/* ============================================================
   8. 준비 완료 알림 — render.mjs 가 기다린다
   ============================================================ */
window.__ready = (async function () {
  const urls = Object.keys(ART).map(function (k) {
    return ART[k];
  });
  await Promise.all(
    urls.map(function (u) {
      return new Promise(function (res) {
        const im = new Image();
        im.onload = res;
        im.onerror = res;
        im.src = u;
      });
    })
  );
  if (document.fonts && document.fonts.ready) {
    try {
      await document.fonts.load('33px "Galmuri11"');
      await document.fonts.ready;
    } catch (e) {
      /* 글꼴을 못 읽어도 렌더는 계속한다 */
    }
  }
  seek(0);
  return true;
})();

window.prepareRender = function () {
  document.body.classList.add("rendering");
  if (pvTimer !== null) {
    cancelAnimationFrame(pvTimer);
    pvTimer = null;
  }
  fitStage(1);
  return true;
};

/* ============================================================
   9. 미리보기 (사람이 브라우저에서 열었을 때만 쓴다)
   ============================================================ */
function fitStage(force) {
  const stage = document.getElementById("stage");
  const s = force !== undefined ? force : Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
  if (Math.abs(s - 1) < 0.0001) {
    stage.style.transform = "none";
  } else {
    stage.style.transform = "scale(" + s + ")";
  }
}

let pvTimer = null;
let pvT0 = 0;
let pvBase = 0;
const pvRange = document.getElementById("pvRange");
const pvTime = document.getElementById("pvTime");
const pvPlay = document.getElementById("pvPlay");
pvRange.max = String(DURATION);

function pvSet(t) {
  seek(t);
  pvRange.value = String(t);
  pvTime.textContent = t.toFixed(2) + "s";
}

function pvLoop() {
  const now = performance.now();
  let t = pvBase + (now - pvT0) / 1000;
  if (t >= DURATION) {
    t = DURATION;
    pvSet(t);
    pvStop();
    return;
  }
  pvSet(t);
  pvTimer = requestAnimationFrame(pvLoop);
}

function pvStop() {
  if (pvTimer !== null) cancelAnimationFrame(pvTimer);
  pvTimer = null;
  pvPlay.textContent = "재생";
}

pvPlay.addEventListener("click", function () {
  if (pvTimer !== null) {
    pvStop();
    return;
  }
  pvBase = parseFloat(pvRange.value) || 0;
  if (pvBase >= DURATION) pvBase = 0;
  pvT0 = performance.now();
  pvPlay.textContent = "멈춤";
  pvTimer = requestAnimationFrame(pvLoop);
});

pvRange.addEventListener("input", function () {
  pvStop();
  pvSet(parseFloat(pvRange.value) || 0);
});

window.addEventListener("resize", function () {
  if (!document.body.classList.contains("rendering")) fitStage();
});

if (new URLSearchParams(location.search).has("render")) {
  document.body.classList.add("rendering");
  fitStage(1);
} else {
  fitStage();
}

seek(0);
</script>
</body>
