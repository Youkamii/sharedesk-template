<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" shape-rendering="crispEdges">
  <!-- 밤바다 — 달빛이 물결에 부서지는 조용한 바닷가. -->
  <defs>
    <pattern id="t1" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0c1222"/>
      <rect width="4" height="4" fill="#10172b"/>
      <rect x="4" y="4" width="4" height="4" fill="#10172b"/>
    </pattern>
    <pattern id="t2" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#12283a"/>
      <rect width="4" height="4" fill="#1d3a44"/>
      <rect x="4" y="4" width="4" height="4" fill="#1d3a44"/>
    </pattern>
    <pattern id="t3" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#1d3a44"/>
      <rect width="4" height="4" fill="#24505b"/>
      <rect x="4" y="4" width="4" height="4" fill="#24505b"/>
    </pattern>
  </defs>
  <rect width="480" height="92" fill="#0c1222"/>
  <rect y="92" width="480" height="16" fill="url(#t1)"/>
  <rect y="108" width="480" height="52" fill="#10172b"/>

  <!-- 별 -->
  <g fill="#fff4d2" opacity="0.85">
    <rect x="44" y="30" width="2" height="2"/>
    <rect x="120" y="58" width="2" height="2"/>
    <rect x="200" y="24" width="2" height="2"/>
    <rect x="284" y="66" width="2" height="2"/>
    <rect x="452" y="40" width="2" height="2"/>
    <rect x="88" y="96" width="2" height="2"/>
  </g>

  <!-- 보름달 -->
  <g fill="#fff4d2">
    <rect x="352" y="36" width="20" height="20"/>
    <rect x="348" y="40" width="4" height="12"/>
    <rect x="372" y="40" width="4" height="12"/>
    <rect x="356" y="32" width="12" height="4"/>
    <rect x="356" y="56" width="12" height="4"/>
  </g>
  <rect x="358" y="42" width="4" height="4" fill="#e5d6b7"/>
  <rect x="364" y="48" width="4" height="4" fill="#e5d6b7"/>

  <!-- 바다 -->
  <rect y="160" width="480" height="40" fill="#12283a"/>
  <rect y="200" width="480" height="12" fill="url(#t2)"/>
  <rect y="212" width="480" height="34" fill="#1d3a44"/>
  <rect y="246" width="480" height="10" fill="url(#t3)"/>
  <rect y="256" width="480" height="14" fill="#24505b"/>

  <!-- 달빛 물길 -->
  <g fill="#ffd27d" opacity="0.9">
    <rect x="356" y="166" width="12" height="2"/>
    <rect x="350" y="176" width="10" height="2"/>
    <rect x="364" y="184" width="12" height="2"/>
    <rect x="354" y="196" width="14" height="2"/>
    <rect x="360" y="210" width="10" height="2"/>
    <rect x="348" y="222" width="16" height="2"/>
    <rect x="362" y="236" width="10" height="2"/>
    <rect x="352" y="250" width="14" height="2"/>
  </g>

  <!-- 물결 하이라이트 -->
  <g fill="#61b3a6" opacity="0.8">
    <rect x="40" y="172" width="14" height="2"/>
    <rect x="120" y="188" width="18" height="2"/>
    <rect x="210" y="170" width="12" height="2"/>
    <rect x="70" y="214" width="16" height="2"/>
    <rect x="256" y="220" width="18" height="2"/>
    <rect x="150" y="240" width="14" height="2"/>
    <rect x="430" y="196" width="14" height="2"/>
    <rect x="300" y="252" width="16" height="2"/>
  </g>
</svg>
