<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" shape-rendering="crispEdges">
  <!-- 새벽 — 밤이 걷히고 살구빛이 올라오는 시간. -->
  <defs>
    <pattern id="a1" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#182446"/>
      <rect width="4" height="4" fill="#2f4670"/>
      <rect x="4" y="4" width="4" height="4" fill="#2f4670"/>
    </pattern>
    <pattern id="a2" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#2f4670"/>
      <rect width="4" height="4" fill="#6f6a93"/>
      <rect x="4" y="4" width="4" height="4" fill="#6f6a93"/>
    </pattern>
    <pattern id="a3" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#6f6a93"/>
      <rect width="4" height="4" fill="#c98a78"/>
      <rect x="4" y="4" width="4" height="4" fill="#c98a78"/>
    </pattern>
    <pattern id="a4" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#c98a78"/>
      <rect width="4" height="4" fill="#f2a56f"/>
      <rect x="4" y="4" width="4" height="4" fill="#f2a56f"/>
    </pattern>
  </defs>
  <rect width="480" height="56" fill="#182446"/>
  <rect y="56" width="480" height="16" fill="url(#a1)"/>
  <rect y="72" width="480" height="44" fill="#2f4670"/>
  <rect y="116" width="480" height="16" fill="url(#a2)"/>
  <rect y="132" width="480" height="30" fill="#6f6a93"/>
  <rect y="162" width="480" height="14" fill="url(#a3)"/>
  <rect y="176" width="480" height="28" fill="#c98a78"/>
  <rect y="204" width="480" height="12" fill="url(#a4)"/>
  <rect y="216" width="480" height="30" fill="#f2a56f"/>

  <!-- 남은 별 -->
  <g fill="#fff4d2" opacity="0.7">
    <rect x="60" y="22" width="2" height="2"/>
    <rect x="170" y="38" width="2" height="2"/>
    <rect x="320" y="26" width="2" height="2"/>
    <rect x="430" y="44" width="2" height="2"/>
  </g>

  <!-- 떠오르는 해 -->
  <g fill="#ffd27d">
    <rect x="216" y="228" width="48" height="6"/>
    <rect x="222" y="222" width="36" height="6"/>
    <rect x="230" y="216" width="20" height="6"/>
  </g>
  <rect x="212" y="234" width="56" height="6" fill="#fff4d2"/>

  <!-- 낮은 구름 -->
  <g fill="#2f4670" opacity="0.75">
    <rect x="52" y="140" width="66" height="6"/>
    <rect x="64" y="134" width="34" height="6"/>
    <rect x="330" y="150" width="80" height="6"/>
    <rect x="348" y="144" width="40" height="6"/>
  </g>
  <g fill="#c98a78">
    <rect x="140" y="184" width="52" height="4"/>
    <rect x="290" y="190" width="64" height="4"/>
  </g>

  <!-- 땅 -->
  <rect y="246" width="480" height="24" fill="#10172b"/>
  <g fill="#182446">
    <rect x="40" y="240" width="36" height="6"/>
    <rect x="210" y="242" width="52" height="4"/>
    <rect x="380" y="240" width="44" height="6"/>
  </g>
</svg>
