<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" shape-rendering="crispEdges">
  <!-- 깊은 밤 — Dusk Room 팔레트의 야간 변형. 디테일은 가장자리에만 둔다. -->
  <defs>
    <pattern id="d1" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#070b16"/>
      <rect width="4" height="4" fill="#0c1222"/>
      <rect x="4" y="4" width="4" height="4" fill="#0c1222"/>
    </pattern>
    <pattern id="d2" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0c1222"/>
      <rect width="4" height="4" fill="#10172b"/>
      <rect x="4" y="4" width="4" height="4" fill="#10172b"/>
    </pattern>
    <pattern id="d3" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#10172b"/>
      <rect width="4" height="4" fill="#141d38"/>
      <rect x="4" y="4" width="4" height="4" fill="#141d38"/>
    </pattern>
  </defs>
  <rect width="480" height="80" fill="#070b16"/>
  <rect y="80" width="480" height="16" fill="url(#d1)"/>
  <rect y="96" width="480" height="60" fill="#0c1222"/>
  <rect y="156" width="480" height="16" fill="url(#d2)"/>
  <rect y="172" width="480" height="52" fill="#10172b"/>
  <rect y="224" width="480" height="12" fill="url(#d3)"/>
  <rect y="236" width="480" height="34" fill="#141d38"/>

  <!-- 별 -->
  <g fill="#fff4d2">
    <rect x="36" y="26" width="2" height="2"/>
    <rect x="98" y="54" width="2" height="2"/>
    <rect x="150" y="18" width="2" height="2"/>
    <rect x="204" y="70" width="2" height="2"/>
    <rect x="262" y="34" width="2" height="2"/>
    <rect x="330" y="62" width="2" height="2"/>
    <rect x="452" y="30" width="2" height="2"/>
  </g>
  <g fill="#79a8e8" opacity="0.85">
    <rect x="66" y="88" width="2" height="2"/>
    <rect x="188" y="42" width="2" height="2"/>
    <rect x="296" y="96" width="2" height="2"/>
    <rect x="416" y="76" width="2" height="2"/>
    <rect x="122" y="110" width="2" height="2"/>
  </g>
  <g fill="#ffd27d">
    <rect x="240" y="20" width="2" height="2"/>
    <rect x="240" y="24" width="2" height="2"/>
    <rect x="238" y="22" width="2" height="2"/>
    <rect x="242" y="22" width="2" height="2"/>
  </g>

  <!-- 초승달 -->
  <g fill="#ffd27d">
    <rect x="392" y="36" width="4" height="20"/>
    <rect x="396" y="32" width="4" height="8"/>
    <rect x="396" y="52" width="4" height="8"/>
    <rect x="400" y="30" width="6" height="4"/>
    <rect x="400" y="58" width="6" height="4"/>
  </g>

  <!-- 지붕 실루엣과 불 켜진 창 -->
  <g fill="#05080f">
    <rect y="252" width="480" height="18"/>
    <rect x="20" y="240" width="52" height="12"/>
    <rect x="96" y="244" width="40" height="8"/>
    <rect x="180" y="238" width="64" height="14"/>
    <rect x="300" y="242" width="44" height="10"/>
    <rect x="392" y="236" width="60" height="16"/>
  </g>
  <g fill="#ffd27d">
    <rect x="34" y="244" width="4" height="4"/>
    <rect x="204" y="242" width="4" height="4"/>
    <rect x="216" y="242" width="4" height="4"/>
    <rect x="410" y="240" width="4" height="4"/>
  </g>
  <g fill="#f2a56f" opacity="0.8">
    <rect x="110" y="246" width="4" height="4"/>
    <rect x="318" y="244" width="4" height="4"/>
  </g>
</svg>
