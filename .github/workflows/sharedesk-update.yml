name: ShareDesk Update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sharedesk-update-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the installed repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.9.0
          cache: npm

      - name: Apply the latest stable ShareDesk release
        run: node scripts/sharedesk-update.mjs --apply

      - name: Install the updated dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit and push the verified update
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "ShareDesk is already current."
            exit 0
          fi
          version="$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update ShareDesk to ${version}"
          git push origin HEAD:main
