name: ShareDesk Auto Update

# 매시 7분에 깨어나 설치된 앱의 공개 정책(/api/update-policy)을 읽고,
# 자동 업데이트가 켜져 있고 자정 창(00~01시)이며 저장소 주인이 템플릿
# 저장소에 별을 눌러 둔 경우에만 수동 업데이트와 동일한 적용·봉인·검증·
# 푸시를 수행한다. 개인 키가 전혀 필요 없다 — 앱 주소는 Vercel이 남긴
# 배포 기록에서 찾고, 배포별 주소가 보호벽에 막히면 프로덕션 별칭
# (<project>.vercel.app)을 유도해 다시 시도한다. workflow_dispatch는
# 시험용으로 자정 조건 없이 같은 판단을 즉시 돌린다.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharedesk-update-main
  cancel-in-progress: false

jobs:
  policy:
    # 배포되지 않는 원본 템플릿 저장소에서는 돌 이유가 없다.
    if: github.repository != 'Youkamii/sharedesk-template'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      deployments: read
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Ask the installed app whether it is update time
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          api="https://api.github.com/repos/$REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          # 1) Vercel의 GitHub 연동이 남긴 Deployments 기록에서 주소 후보를 모은다.
          candidates=()
          deployments="$(curl -sS --max-time 20 "${auth[@]}" "$api/deployments?per_page=20" || echo '[]')"
          for id in $(printf '%s' "$deployments" | jq -r '[.[] | select((.environment // "") | test("^production$"; "i"))][:5] | .[].id' 2>/dev/null); do
            status_url="$(curl -sS --max-time 20 "${auth[@]}" "$api/deployments/$id/statuses?per_page=5" | jq -r '[.[] | select(.state == "success") | .environment_url // empty][0] // empty' 2>/dev/null)"
            if [[ "$status_url" == https://* ]]; then
              candidates+=("$status_url")
              break
            fi
          done
          # 2) 배포별 주소는 보호벽에 막힐 수 있다 — 프로덕션 별칭을 유도해 뒤에 붙인다.
          if [[ ${#candidates[@]} -gt 0 ]]; then
            host="${candidates[0]#https://}"
            host="${host%%/*}"
            if [[ "$host" == *.vercel.app ]]; then
              label="${host%.vercel.app}"
              IFS='-' read -ra parts <<< "$label"
              n=${#parts[@]}
              for ((k=n-1; k>=1; k--)); do
                prefix="$(IFS=-; echo "${parts[*]:0:$k}")"
                candidates+=("https://${prefix}.vercel.app")
              done
            fi
          fi
          if [[ ${#candidates[@]} -eq 0 ]]; then
            echo "No deployment records found; nothing to do."
            exit 0
          fi
          # 3) 후보를 차례로 두드려 진짜 정책(JSON에 autoUpdate 키)을 찾는다.
          policy=""
          for base in "${candidates[@]}"; do
            body="$(curl -sS --max-time 15 "$base/api/update-policy" || true)"
            if jq -e 'has("autoUpdate")' <<< "$body" > /dev/null 2>&1; then
              policy="$body"
              break
            fi
          done
          if [[ -z "$policy" ]]; then
            echo "Could not reach the installed app's policy; nothing to do."
            exit 0
          fi
          auto="$(jq -r '.autoUpdate // false' <<< "$policy")"
          midnight="$(jq -r '.midnight // false' <<< "$policy")"
          if [[ "$auto" != "true" ]]; then
            echo "Auto update is turned off; nothing to do."
            exit 0
          fi
          # 자정 판정은 앱이 저장된 시간대로 계산해 준다(00~01시 창).
          if [[ "$EVENT_NAME" == "schedule" && "$midnight" != "true" ]]; then
            echo "Not the midnight window yet; waiting."
            exit 0
          fi
          # 4) 별이 실제로 박혀 있어야만 돈다 — 저장소 주인이 스타한 저장소
          #    목록(공개)에 템플릿이 있는지 확인한다. 토큰 조회가 거부되면
          #    익명으로 다시 시도한다.
          owner="${REPOSITORY%%/*}"
          starred="false"
          for page in $(seq 1 10); do
            body="$(curl -sS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/users/$owner/starred?per_page=100&page=$page" || true)"
            names="$(jq -r '.[].full_name' <<< "$body" 2>/dev/null)"
            if [[ -z "$names" ]]; then
              body="$(curl -sS --max-time 20 -H "Accept: application/vnd.github+json" "https://api.github.com/users/$owner/starred?per_page=100&page=$page" || true)"
              names="$(jq -r '.[].full_name' <<< "$body" 2>/dev/null)"
            fi
            if grep -qix "Youkamii/sharedesk-template" <<< "$names"; then
              starred="true"
              break
            fi
            count="$(grep -c . <<< "$names" || true)"
            if [[ "$count" -lt 100 ]]; then
              break
            fi
          done
          if [[ "$starred" != "true" ]]; then
            echo "The repository owner has not starred the ShareDesk repository; skipping."
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  prepare:
    needs: policy
    if: needs.policy.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - name: Check out the installed repository without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Apply the latest stable ShareDesk release
        run: node scripts/sharedesk-update.mjs --apply

      - name: Seal the proposed update before running release code
        id: patch
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --quiet -- .github/workflows/sharedesk-update.yml .github/workflows/sharedesk-auto-update.yml; then
            echo "The update workflow changed. Run the one-time bootstrap in docs/UPDATE.md."
            exit 1
          fi
          git add -A
          git diff --cached --binary --full-index --no-ext-diff > "$RUNNER_TEMP/sharedesk-update.patch"
          test -s "$RUNNER_TEMP/sharedesk-update.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Store the sealed update
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sharedesk-auto-update-patch
          path: ${{ runner.temp }}/sharedesk-update.patch
          if-no-files-found: error
          retention-days: 1

      - name: Set up the updated Node.js version
        if: steps.patch.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify the updated release without write credentials
        if: steps.patch.outputs.changed == 'true'
        run: node scripts/sharedesk-verify.mjs

  publish:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the installed repository without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download the verified update
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sharedesk-auto-update-patch
          path: ${{ runner.temp }}/sharedesk-update

      - name: Commit and push the verified update
        shell: bash
        env:
          UPDATE_AUTHOR_NAME: ${{ github.actor }}
          UPDATE_AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          UPDATE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          patch="$RUNNER_TEMP/sharedesk-update/sharedesk-update.patch"
          git apply --index --binary --whitespace=nowarn "$patch"
          if ! git diff --cached --quiet -- .github/workflows; then
            echo "A verified update cannot change GitHub workflows."
            exit 1
          fi
          git diff --cached --check
          version="$(git show :package.json | sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*$/\1/p' | head -n1)"
          test -n "$version"
          git config user.name "$UPDATE_AUTHOR_NAME"
          git config user.email "$UPDATE_AUTHOR_EMAIL"
          git -c core.hooksPath=/dev/null commit -m "chore: update ShareDesk to ${version}"
          auth="$(printf 'x-access-token:%s' "$UPDATE_GITHUB_TOKEN" | base64 -w0)"
          git -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:main
