name: ShareDesk Auto Update

# 자동 업데이트의 두 얼굴:
# 1) register — 앱(관리자 설정)이 workflow_dispatch 입력으로 켜기/끄기와
#    시간대를 보내면 sharedesk-auto-update.json에 기록해 커밋한다.
#    앱 주소를 몰라도 되는 유일한 통신로다(Vercel 보호벽·배포 URL 문제 없음).
# 2) schedule — 매시 7분에 깨어나 그 기록을 읽고, 켜져 있고 그 시간대가
#    자정 창(00~01시)이며 저장소 주인이 템플릿 저장소에 별을 눌러 둔
#    경우에만 수동 업데이트와 동일한 적용·봉인·검증·푸시를 수행한다.
#    개인 키가 필요 없다 — 저장소 자체의 GITHUB_TOKEN만 쓴다.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "enable 또는 disable (비우면 예약 실행처럼 판단만 한다)"
        required: false
        type: string
      timezone:
        description: "IANA 시간대 (enable일 때 필수)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sharedesk-update-main
  cancel-in-progress: false

jobs:
  register:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the installed repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Record the auto-update setting
        shell: bash
        env:
          ACTION: ${{ github.event.inputs.action }}
          TIMEZONE: ${{ github.event.inputs.timezone }}
          AUTHOR_NAME: ${{ github.actor }}
          AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        run: |
          if [[ "$ACTION" != "enable" && "$ACTION" != "disable" ]]; then
            echo "Unknown action: $ACTION"
            exit 1
          fi
          enabled="false"
          tz=""
          if [[ "$ACTION" == "enable" ]]; then
            if ! [[ "$TIMEZONE" =~ ^([A-Za-z_]+(/[A-Za-z0-9_+-]+)+|UTC)$ ]]; then
              echo "Unusable timezone: $TIMEZONE"
              exit 1
            fi
            enabled="true"
            tz="$TIMEZONE"
          fi
          printf '{\n  "enabled": %s,\n  "timezone": "%s"\n}\n' "$enabled" "$tz" > sharedesk-auto-update.json
          if git ls-files --error-unmatch sharedesk-auto-update.json > /dev/null 2>&1 && git diff --quiet -- sharedesk-auto-update.json; then
            echo "Setting unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git add sharedesk-auto-update.json
          git -c core.hooksPath=/dev/null commit -m "chore: set automatic updates to ${ACTION}"
          git push origin HEAD:main

  policy:
    # 배포되지 않는 원본 템플릿 저장소에서는 돌 이유가 없다.
    if: |
      github.repository != 'Youkamii/sharedesk-template' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.action == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Check out the recorded setting
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Decide whether tonight is update night
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          if [[ ! -f sharedesk-auto-update.json ]]; then
            echo "Auto update has never been turned on; nothing to do."
            exit 0
          fi
          enabled="$(jq -r '.enabled // false' sharedesk-auto-update.json 2>/dev/null || echo false)"
          tz="$(jq -r '.timezone // empty' sharedesk-auto-update.json 2>/dev/null || true)"
          if [[ "$enabled" != "true" ]]; then
            echo "Auto update is turned off; nothing to do."
            exit 0
          fi
          if ! [[ "$tz" =~ ^([A-Za-z_]+(/[A-Za-z0-9_+-]+)+|UTC)$ ]]; then
            echo "The recorded timezone is unusable; nothing to do."
            exit 0
          fi
          hour="$(TZ="$tz" date +%H)"
          if [[ "$EVENT_NAME" == "schedule" && "$hour" != "00" && "$hour" != "01" ]]; then
            echo "It is ${hour}:xx in ${tz}; waiting for the midnight window."
            exit 0
          fi
          # 별이 실제로 박혀 있어야만 돈다 — 저장소 주인이 스타한 저장소
          # 목록(공개)에 템플릿이 있는지 확인한다. 토큰 조회가 거부되면
          # 익명으로 다시 시도한다.
          owner="${REPOSITORY%%/*}"
          starred="false"
          for page in $(seq 1 10); do
            body="$(curl -sS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/users/$owner/starred?per_page=100&page=$page" || true)"
            names="$(jq -r '.[].full_name' <<< "$body" 2>/dev/null)"
            if [[ -z "$names" ]]; then
              body="$(curl -sS --max-time 20 -H "Accept: application/vnd.github+json" "https://api.github.com/users/$owner/starred?per_page=100&page=$page" || true)"
              names="$(jq -r '.[].full_name' <<< "$body" 2>/dev/null)"
            fi
            if grep -qix "Youkamii/sharedesk-template" <<< "$names"; then
              starred="true"
              break
            fi
            count="$(grep -c . <<< "$names" || true)"
            if [[ "$count" -lt 100 ]]; then
              break
            fi
          done
          if [[ "$starred" != "true" ]]; then
            echo "The repository owner has not starred the ShareDesk repository; skipping."
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  prepare:
    needs: policy
    if: needs.policy.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - name: Check out the installed repository without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Apply the latest stable ShareDesk release
        run: node scripts/sharedesk-update.mjs --apply

      - name: Seal the proposed update before running release code
        id: patch
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --quiet -- .github/workflows/sharedesk-update.yml .github/workflows/sharedesk-auto-update.yml; then
            echo "The update workflow changed. Run the one-time bootstrap in docs/UPDATE.md."
            exit 1
          fi
          git add -A
          git diff --cached --binary --full-index --no-ext-diff > "$RUNNER_TEMP/sharedesk-update.patch"
          test -s "$RUNNER_TEMP/sharedesk-update.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Store the sealed update
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sharedesk-auto-update-patch
          path: ${{ runner.temp }}/sharedesk-update.patch
          if-no-files-found: error
          retention-days: 1

      - name: Set up the updated Node.js version
        if: steps.patch.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify the updated release without write credentials
        if: steps.patch.outputs.changed == 'true'
        run: node scripts/sharedesk-verify.mjs

  publish:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the installed repository without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download the verified update
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sharedesk-auto-update-patch
          path: ${{ runner.temp }}/sharedesk-update

      - name: Commit and push the verified update
        shell: bash
        env:
          UPDATE_AUTHOR_NAME: ${{ github.actor }}
          UPDATE_AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          UPDATE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          patch="$RUNNER_TEMP/sharedesk-update/sharedesk-update.patch"
          git apply --index --binary --whitespace=nowarn "$patch"
          if ! git diff --cached --quiet -- .github/workflows; then
            echo "A verified update cannot change GitHub workflows."
            exit 1
          fi
          git diff --cached --check
          version="$(git show :package.json | sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*$/\1/p' | head -n1)"
          test -n "$version"
          git config user.name "$UPDATE_AUTHOR_NAME"
          git config user.email "$UPDATE_AUTHOR_EMAIL"
          git -c core.hooksPath=/dev/null commit -m "chore: update ShareDesk to ${version}"
          auth="$(printf 'x-access-token:%s' "$UPDATE_GITHUB_TOKEN" | base64 -w0)"
          git -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:main
